appId: com.harnessdesktop.app
productName: Harness Desktop
asar: true
npmRebuild: false

directories:
  output: release

files:
  - dist/**/*
  - src/loading.html
  # The floating pet's page, its script, and its sandboxed preload (hand-written
  # CommonJS: a sandboxed preload cannot be an ES module, so it is shipped as an
  # asset rather than compiled by tsc).
  - src/pet-overlay.html
  - src/pet-overlay-page.js
  - src/pet-overlay-preload.cjs
  # The vision engine's settings page, shipped the same way.
  - src/modlens-config.html
  - src/modlens-config-preload.cjs
  - build/icon.png
  - package.json

# dsh loads plugins dynamically and includes native runtime modules. Keeping
# production dependencies unpacked avoids executable and ASAR path issues: the
# pnpm this application ships runs as a real file in a child process, and the
# packages a profile install writes resolve under the same tree.
asarUnpack:
  - node_modules/**/*

win:
  executableName: Harness Desktop
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harness Desktop
  artifactName: Harness-Desktop-Setup-${version}.${ext}
