appId: com.harnessdesktop.app
productName: Harness Desktop
asar: true
npmRebuild: false

directories:
  output: release

files:
  - dist/**/*
  - src/loading.html
  - build/icon.png
  - plugins/**/*
  - package.json

# dsh loads plugins dynamically and includes native runtime modules. Keeping
# production dependencies unpacked avoids executable and ASAR path issues.
# `plugins/` is unpacked for the same reason: the profile copy reads it as a real
# directory tree, and a plugin that ships two halves must arrive intact — a
# missing client half is a boot failure, not a degraded feature.
asarUnpack:
  - node_modules/**/*
  - plugins/**/*

win:
  executableName: Harness Desktop
  icon: build/icon.png
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Harness Desktop
  artifactName: Harness-Desktop-Setup-${version}.${ext}
