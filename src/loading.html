<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harness Desktop</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont,
          "Segoe UI", sans-serif;
        background: #151517;
        color: #f9fafb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
      }

      main {
        width: min(520px, calc(100vw - 48px));
        text-align: center;
      }

      .mark {
        width: 44px;
        height: 44px;
        margin: 0 auto 20px;
        display: grid;
        place-items: center;
        border-radius: 8px;
        background: #15171a;
        color: white;
        font-size: 18px;
        font-weight: 700;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        line-height: 1.25;
        letter-spacing: 0;
      }

      #status {
        margin: 12px 0 0;
        color: #666c75;
        font-size: 14px;
        line-height: 1.6;
      }

      .progress {
        width: 180px;
        height: 3px;
        margin: 24px auto 0;
        overflow: hidden;
        background: #dfe2e7;
      }

      .progress::after {
        content: "";
        display: block;
        width: 45%;
        height: 100%;
        background: #2563eb;
        animation: loading 1.1s ease-in-out infinite;
      }

      #error {
        display: none;
        margin-top: 24px;
        text-align: left;
      }

      #error h2 {
        margin: 0 0 10px;
        font-size: 15px;
        letter-spacing: 0;
      }

      #details {
        max-height: 280px;
        margin: 0;
        padding: 14px;
        overflow: auto;
        border: 1px solid #dfe2e7;
        background: #ffffff;
        color: #454a52;
        font: 12px/1.55 ui-monospace, SFMono-Regular, Consolas, monospace;
        white-space: pre-wrap;
        word-break: break-word;
      }

      @keyframes loading {
        from {
          transform: translateX(-110%);
        }
        to {
          transform: translateX(230%);
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="mark" aria-hidden="true">HD</div>
      <h1>Harness Desktop</h1>
      <p id="status">正在准备本地服务…</p>
      <div class="progress" id="progress" aria-hidden="true"></div>
      <section id="error">
        <h2 id="error-title"></h2>
        <pre id="details"></pre>
      </section>
    </main>
    <script>
      window.setStatus = (message) => {
        document.getElementById("status").textContent = message;
      };

      window.showError = (title, details) => {
        document.getElementById("status").textContent = "本地服务未能启动";
        document.getElementById("progress").style.display = "none";
        document.getElementById("error-title").textContent = title;
        document.getElementById("details").textContent = details;
        document.getElementById("error").style.display = "block";
      };
    </script>
  </body>
</html>
