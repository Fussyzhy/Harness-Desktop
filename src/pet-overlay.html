<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!--
      The overlay is a local, self-authored page served by this application's
      own loopback origin. `connect-src`/`img-src` stay open because a pet model
      is loaded from wherever the user pointed it (the curated presets live on a
      CDN, custom models are often a local HTTP server), and live2d-display
      fetches the .model3.json, .moc3 and textures itself at runtime.
      `'unsafe-eval'` is not optional: the vendored PIXI build refuses to start
      without it ("Current environment does not allow unsafe-eval, please use
      @pixi/unsafe-eval module"), and it is the same build the plugin loads
      inside the DSH page.
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; connect-src *; img-src * data: blob:; media-src * data: blob:; font-src 'self' data:"
    />
    <title>Harness Desktop pet</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        /* The window is fully transparent: only the pet and its bubble paint. */
      }

      #stage {
        position: fixed;
        left: 50%;
        /* Canvas is bottom-centred with a small constant margin; the main
           process anchors the window bottom when the pet is resized. */
        bottom: 6px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        pointer-events: none;
      }

      #bubble {
        order: 1;
        margin-bottom: 8px;
        max-width: 260px;
        padding: 4px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.95);
        color: #222;
        font: 12px/1.5 system-ui, sans-serif;
        white-space: nowrap;
        text-align: center;
        opacity: 0;
        transition: opacity 0.2s;
        pointer-events: none;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
      }

      #stage canvas {
        order: 2;
        display: block;
        /* The pet is the only interactive pixel region of the window. */
        pointer-events: auto;
        cursor: grab;
      }

      #stage canvas.dragging {
        cursor: grabbing;
      }

      #fallback {
        order: 2;
        display: none;
        width: 64px;
        height: 64px;
        align-items: center;
        justify-content: center;
        border-radius: 16px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        font-size: 36px;
        pointer-events: auto;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <div id="bubble"></div>
      <!-- The pet canvas is created by page.js: every model load needs a fresh
           element, because PIXI owns the WebGL context of the canvas it is
           given and a destroyed context cannot be reused. -->
      <div id="fallback">🐾</div>
    </div>
    <script src="/page.js"></script>
  </body>
</html>
